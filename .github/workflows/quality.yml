name: MASTERCORE Quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[quality]"
      - name: Run G0-G8 quality gate engine
        id: quality
        continue-on-error: true
        run: python tools/validate_mastercore.py --profile ci --json quality-evidence.json
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastercore-quality-evidence
          path: quality-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce required gates
        if: steps.quality.outcome != 'success'
        run: exit 1
