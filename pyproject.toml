[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mastercore"
version = "2.1.1"
description = "Reusable safety, validation, storage and quality foundation"
requires-python = ">=3.12"
dependencies = []

[project.gui-scripts]
mastercore-start = "mastercore.composition.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mastercore"]
mypy_path = "src"
